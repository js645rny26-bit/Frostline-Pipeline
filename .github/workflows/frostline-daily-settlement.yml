name: Frostline daily settlement

on:
  workflow_dispatch:
    inputs:
      date:
        description: Completed MLB slate date to settle (YYYY-MM-DD)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  daily-settlement:
    if: github.ref == 'refs/heads/commissioning/bridge-repair-2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PORT: 3000
      SETTLEMENT_DATE: ${{ inputs.date }}
      FROSTLINE_SHEETS_BACKEND: google
      FROSTLINE_WORKBOOK_ID: 1KPYzbSawLIrOcckn5EXxO4vH5eABOhMIibhCgpF-oNs
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.FROSTLINE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.FROSTLINE_GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Initialize evidence files
        run: |
          : > frostline-api-server.log
          echo '{"status":"NOT_RUN"}' > frostline-settlement-report.json
          echo '{"status":"NOT_RUN"}' > frostline-settlement-readback.json
          echo '{"status":"NOT_RUN"}' > frostline-settlement-validation.json

      - name: Resolve settlement date
        shell: bash
        run: |
          set -euo pipefail
          resolved_date="${SETTLEMENT_DATE}"
          if [ -z "$resolved_date" ]; then
            resolved_date="$(TZ=America/New_York date --date='yesterday' +%F)"
          fi
          if ! [[ "$resolved_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error title=Invalid settlement date::Use YYYY-MM-DD."
            exit 1
          fi
          echo "SETTLEMENT_DATE=$resolved_date" >> "$GITHUB_ENV"
          echo "Resolved settlement date: $resolved_date"

      - name: Authenticate Google ADC through GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/drive.file

      - name: Export short-lived Google access token
        run: |
          echo "FROSTLINE_GOOGLE_ACCESS_TOKEN=${{ steps.google-auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run complete API-server test suite
        working-directory: artifacts/api-server
        run: |
          find src -name '*.test.ts' -print0 |
            xargs -0 node --import tsx/esm --test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run isolated daily settlement
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server start \
            > frostline-api-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/healthz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "API server did not become ready."
            cat frostline-api-server.log
            exit 1
          fi

          set +e
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request GET \
            "http://127.0.0.1:3000/api/pipeline/settle?date=${SETTLEMENT_DATE}&workbook_id=${FROSTLINE_WORKBOOK_ID}" \
            --output frostline-settlement-report.json
          settlement_status=$?
          set -e

          cat frostline-settlement-report.json

          if [ "$settlement_status" -ne 0 ]; then
            echo "::error title=Isolated settlement request failed::The settlement endpoint returned a failure."
            cat frostline-api-server.log
            exit "$settlement_status"
          fi

          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("frostline-settlement-report.json", "utf8"));
          const failures = [];
          const settlement = report.settlement ?? {};
          const regression = report.regression ?? {};
          const starterAudit = report.starter_audit ?? {};
          const postmortem = report.vehicle_postmortem ?? {};
          const replay = report.survival_replay ?? {};

          if (report.status !== "success") failures.push(`status: ${report.status ?? "missing"}`);
          if (report.date !== process.env.SETTLEMENT_DATE) failures.push(`date: ${report.date ?? "missing"}`);
          if (report.settlement_status !== "success") failures.push(`settlement_status: ${report.settlement_status ?? "missing"}`);
          if (report.regression_status !== "success") failures.push(`regression_status: ${report.regression_status ?? "missing"}`);
          if (report.starter_audit_status !== "success") failures.push(`starter_audit_status: ${report.starter_audit_status ?? "missing"}`);
          if (report.postmortem_status !== "success") failures.push(`postmortem_status: ${report.postmortem_status ?? "missing"}`);
          if (report.replay_status !== "success") failures.push(`replay_status: ${report.replay_status ?? "missing"}`);
          if (!Number.isInteger(settlement.games_found) || settlement.games_found <= 0) {
            failures.push(`settlement.games_found: ${settlement.games_found ?? "missing"}`);
          }
          if (settlement.games_no_actual !== 0) failures.push(`settlement.games_no_actual: ${settlement.games_no_actual ?? "missing"}`);
          if ((settlement.games_settled ?? 0) + (settlement.games_updated ?? 0) + (settlement.games_skipped ?? 0) !== settlement.games_found) {
            failures.push("not every projected game was settled, provenance-updated, or already complete");
          }
          if (!Array.isArray(regression.windows) || regression.windows.length !== 4) failures.push("regression.windows must contain 7d, 30d, ytd, and all");
          if (!Number.isInteger(starterAudit.pitchers_audited) || starterAudit.pitchers_audited <= 0) failures.push(`starter_audit.pitchers_audited: ${starterAudit.pitchers_audited ?? "missing"}`);
          if ((postmortem.games_no_outcome ?? 0) !== 0) failures.push(`vehicle_postmortem.games_no_outcome: ${postmortem.games_no_outcome ?? "missing"}`);
          if (!Array.isArray(replay.rows) || replay.rows.length === 0) failures.push("survival_replay.rows is empty");
          if (Array.isArray(report.errors) && report.errors.length > 0) failures.push(`errors: ${JSON.stringify(report.errors)}`);
          if (Array.isArray(settlement.errors) && settlement.errors.length > 0) failures.push(`settlement.errors: ${JSON.stringify(settlement.errors)}`);
          if (Array.isArray(regression.errors) && regression.errors.length > 0) failures.push(`regression.errors: ${JSON.stringify(regression.errors)}`);
          if (Array.isArray(starterAudit.errors) && starterAudit.errors.length > 0) failures.push(`starter_audit.errors: ${JSON.stringify(starterAudit.errors)}`);
          if (Array.isArray(postmortem.errors) && postmortem.errors.length > 0) failures.push(`vehicle_postmortem.errors: ${JSON.stringify(postmortem.errors)}`);
          if (Array.isArray(replay.errors) && replay.errors.length > 0) failures.push(`survival_replay.errors: ${JSON.stringify(replay.errors)}`);

          if (failures.length > 0) {
            console.error(`Settlement semantic gate failed:\n${failures.join("\n")}`);
            process.exit(1);
          }

          console.log("Settlement endpoint semantic gate passed.");
          NODE

      - name: Confirm settlement and replay sheet writes
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --get \
            --header "Authorization: Bearer ${FROSTLINE_GOOGLE_ACCESS_TOKEN}" \
            --data-urlencode "ranges=SHADOW_OUTCOMES!A:AG" \
            --data-urlencode "ranges=VEHICLE_POSTMORTEM!A:S" \
            --data-urlencode "ranges=REGRESSION_REPORT!A:L" \
            --data-urlencode "ranges=STARTER_AUDIT!A:J" \
            --data-urlencode "ranges=SURVIVAL_GATE_REPLAY!A:AL" \
            --data-urlencode "ranges=PROJECTION_REPLAY!A:AE" \
            "https://sheets.googleapis.com/v4/spreadsheets/${FROSTLINE_WORKBOOK_ID}/values:batchGet" \
            --output frostline-settlement-readback.json

          node <<'NODE'
          const fs = require("fs");
          const date = process.env.SETTLEMENT_DATE;
          const endpoint = JSON.parse(fs.readFileSync("frostline-settlement-report.json", "utf8"));
          const readback = JSON.parse(fs.readFileSync("frostline-settlement-readback.json", "utf8"));
          const ranges = readback.valueRanges ?? [];
          const failures = [];

          const rowsForDate = (index) => (ranges[index]?.values ?? [])
            .slice(1)
            .filter((row) => String(row[0] ?? "").trim() === date);
          const outcomes = rowsForDate(0);
          const postmortem = rowsForDate(1);
          const regression = (ranges[2]?.values ?? []).slice(1).filter((row) => String(row[0] ?? "").trim());
          const starterAudit = (ranges[3]?.values ?? []).slice(1).filter((row) => String(row[0] ?? "").trim());
          const replay = rowsForDate(4);
          const projectionReplay = rowsForDate(5);
          const outcomeIds = new Set(outcomes.map((row) => String(row[1] ?? "").trim()).filter(Boolean));
          const postmortemIds = new Set(postmortem.map((row) => String(row[1] ?? "").trim()).filter(Boolean));
          const replayIds = new Set(replay.map((row) => String(row[1] ?? "").trim()).filter(Boolean));
          const projectionReplayIds = new Set(projectionReplay.map((row) => String(row[1] ?? "").trim()).filter(Boolean));
          const postmortemByGame = new Map(postmortem.map((row) => [String(row[1] ?? "").trim(), row]));
          const replayByGame = new Map(replay.map((row) => [String(row[1] ?? "").trim(), row]));
          const expected = endpoint.settlement?.games_found ?? 0;

          if (outcomes.length !== expected) failures.push(`SHADOW_OUTCOMES rows: expected ${expected}, received ${outcomes.length}`);
          if (outcomeIds.size !== outcomes.length) failures.push("SHADOW_OUTCOMES contains duplicate game IDs for the date");
          for (const row of outcomes) {
            const gameId = String(row[1] ?? "").trim();
            if (!String(row[15] ?? "").trim()) failures.push(`SHADOW_OUTCOMES frozen projection source is missing for ${gameId}`);
            if (!String(row[32] ?? "").trim()) failures.push(`SHADOW_OUTCOMES pitcher provenance status is missing for ${gameId}`);
            if (!String(row[24] ?? "").trim() || !String(row[25] ?? "").trim()) failures.push(`SHADOW_OUTCOMES actual starters are missing for ${gameId}`);
          }
          if (postmortem.length !== expected) failures.push(`VEHICLE_POSTMORTEM rows: expected ${expected}, received ${postmortem.length}`);
          if (postmortemIds.size !== postmortem.length) failures.push("VEHICLE_POSTMORTEM contains duplicate game IDs for the date");
          for (const row of postmortem) {
            if (row.length < 19 || !String(row[18] ?? "").trim()) failures.push(`VEHICLE_POSTMORTEM schema is incomplete for ${String(row[1] ?? "unknown")}`);
          }
          const expectedWindows = new Set(["7d", "30d", "ytd", "all"]);
          for (const row of regression) expectedWindows.delete(String(row[0] ?? "").trim());
          if (expectedWindows.size > 0) failures.push(`REGRESSION_REPORT is missing windows: ${[...expectedWindows].join(", ")}`);
          const auditedPitchers = new Set(starterAudit.map((row) => String(row[0] ?? "").trim()).filter(Boolean));
          const invalidAuditedPitchers = [...auditedPitchers].filter((pitcher) =>
            /^[-+]?\d+(\.\d+)?$/.test(pitcher) || pitcher === "FROZEN_VEHICLE_LOG"
          );
          if (invalidAuditedPitchers.length > 0) failures.push(`STARTER_AUDIT contains invalid pitcher identities: ${invalidAuditedPitchers.join(", ")}`);
          for (const row of outcomes) {
            for (const pitcher of [String(row[24] ?? "").trim(), String(row[25] ?? "").trim()]) {
              if (pitcher && !auditedPitchers.has(pitcher)) failures.push(`STARTER_AUDIT is missing actual starter ${pitcher}`);
            }
          }
          if (replay.length !== expected) failures.push(`SURVIVAL_GATE_REPLAY rows: expected ${expected}, received ${replay.length}`);
          if (replayIds.size !== replay.length) failures.push("SURVIVAL_GATE_REPLAY contains duplicate game IDs for the date");
          for (const gameId of outcomeIds) {
            if (!replayIds.has(gameId)) failures.push(`SURVIVAL_GATE_REPLAY is missing ${gameId}`);
          }
          for (const row of replay) {
            if (!String(row[37] ?? "").trim()) failures.push(`SURVIVAL_GATE_REPLAY provenance flag is missing for ${String(row[1] ?? "unknown")}`);
          }
          for (const row of outcomes) {
            if (String(row[19] ?? "").trim() !== "PUSH") continue;
            const gameId = String(row[1] ?? "").trim();
            const postmortemRow = postmortemByGame.get(gameId);
            const replayRow = replayByGame.get(gameId);
            if (String(postmortemRow?.[12] ?? "").trim() !== "TRUTH_PUSH") {
              failures.push(`VEHICLE_POSTMORTEM did not preserve PUSH truth for ${gameId}`);
            }
            if (String(postmortemRow?.[16] ?? "").includes("DIRECTION_MISS")) {
              failures.push(`VEHICLE_POSTMORTEM incorrectly marked PUSH as DIRECTION_MISS for ${gameId}`);
            }
            if (String(replayRow?.[11] ?? "").trim() !== "PUSH") {
              failures.push(`SURVIVAL_GATE_REPLAY did not preserve PUSH for ${gameId}`);
            }
          }
          if (projectionReplay.length !== expected) failures.push(`PROJECTION_REPLAY rows: expected ${expected}, received ${projectionReplay.length}`);
          if (projectionReplayIds.size !== projectionReplay.length) failures.push("PROJECTION_REPLAY contains duplicate game IDs for the date");
          const frozenLabel = `aug${Number(date.slice(8, 10))}_frozen_published`;
          if (!regression.some((row) => String(row[0] ?? "").trim() === frozenLabel)) failures.push(`REGRESSION_REPORT is missing ${frozenLabel}`);

          const validation = {
            status: failures.length === 0 ? "PASS" : "FAIL",
            date,
            expected_games: expected,
            shadow_outcomes_rows: outcomes.length,
            shadow_outcomes_unique_games: outcomeIds.size,
            vehicle_postmortem_rows: postmortem.length,
            regression_report_rows: regression.length,
            starter_audit_rows: starterAudit.length,
            survival_gate_replay_rows: replay.length,
            survival_gate_replay_unique_games: replayIds.size,
            projection_replay_rows: projectionReplay.length,
            projection_replay_unique_games: projectionReplayIds.size,
            failures,
          };
          fs.writeFileSync("frostline-settlement-validation.json", JSON.stringify(validation, null, 2));
          console.log(JSON.stringify(validation, null, 2));

          if (failures.length > 0) process.exit(1);
          NODE

      - name: Upload settlement evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frostline-daily-settlement-${{ github.run_id }}
          path: |
            frostline-settlement-report.json
            frostline-settlement-readback.json
            frostline-settlement-validation.json
            frostline-api-server.log
          if-no-files-found: error
