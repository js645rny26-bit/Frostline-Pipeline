name: Frostline BVH V1 disposable commissioning

on:
  workflow_dispatch:
    inputs:
      slate_date:
        description: Future MLB slate date for isolated pregame smoke (YYYY-MM-DD; blank = tomorrow ET)
        required: false
        default: ""
        type: string
      history_start:
        description: First cutoff-safe Savant date to materialize (maximum 31-calendar-day window)
        required: false
        default: "2026-09-01"
        type: string
      history_end:
        description: Last completed Savant date to materialize (blank = yesterday ET)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  bvh-v1-disposable-commissioning:
    if: github.ref == 'refs/heads/commissioning/bridge-repair-2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PORT: 3000
      FROSTLINE_SHEETS_BACKEND: google
      FROSTLINE_WORKBOOK_ID: 1KPYzbSawLIrOcckn5EXxO4vH5eABOhMIibhCgpF-oNs
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.FROSTLINE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.FROSTLINE_GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve bounded commissioning dates
        shell: bash
        run: |
          set -euo pipefail
          today_et="$(TZ=America/New_York date +%F)"
          slate_date="${{ inputs.slate_date }}"
          history_start="${{ inputs.history_start }}"
          history_end="${{ inputs.history_end }}"
          if [ -z "$slate_date" ]; then slate_date="$(TZ=America/New_York date --date='tomorrow' +%F)"; fi
          if [ -z "$history_end" ]; then history_end="$(TZ=America/New_York date --date='yesterday' +%F)"; fi
          for value in "$slate_date" "$history_start" "$history_end"; do
            if ! [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error title=Invalid BVH commissioning date::Expected YYYY-MM-DD, received '$value'."
              exit 1
            fi
          done
          if [[ "$slate_date" < "$today_et" ]] || [[ "$slate_date" == "$today_et" ]]; then
            echo "::error title=Unsafe BVH smoke date::The isolated pregame slate must be in the future."
            exit 1
          fi
          if [[ "$history_end" > "$(date --date="$slate_date - 1 day" +%F)" ]]; then
            echo "::error title=BVH cutoff violation::History must end no later than slate date minus one."
            exit 1
          fi
          echo "BVH_SLATE_DATE=$slate_date" >> "$GITHUB_ENV"
          echo "BVH_HISTORY_START=$history_start" >> "$GITHUB_ENV"
          echo "BVH_HISTORY_END=$history_end" >> "$GITHUB_ENV"

      - name: Authenticate Google ADC through GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/drive.file

      - name: Export short-lived Google access token
        run: echo "FROSTLINE_GOOGLE_ACCESS_TOKEN=${{ steps.google-auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Install, typecheck, test, and build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          cd artifacts/api-server
          find src -name '*.test.ts' -print0 | xargs -0 node --import tsx/esm --test
          cd ../..
          pnpm --filter @workspace/api-server run build

      - name: Create and commission a disposable BVH workbook
        shell: bash
        run: |
          set -euo pipefail
          : > frostline-api-server.log
          echo '{"status":"NOT_RUN"}' > frostline-bvh-workbook.json
          echo '{"status":"NOT_RUN"}' > frostline-bvh-backfill.json
          echo '{"status":"NOT_RUN"}' > frostline-bvh-publish.json
          echo '{"status":"NOT_RUN"}' > frostline-bvh-audit.json

          pnpm --filter @workspace/api-server start > frostline-api-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/healthz >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "API server did not become ready."
            cat frostline-api-server.log
            exit 1
          fi

          curl --silent --show-error --fail-with-body --request POST \
            "http://127.0.0.1:3000/api/workbook/create?date=${BVH_SLATE_DATE}" \
            --output frostline-bvh-workbook.json
          cat frostline-bvh-workbook.json
          test_workbook_id="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!r.workbook_id||r.errors?.length) process.exit(1); process.stdout.write(r.workbook_id);' frostline-bvh-workbook.json)"
          case "$test_workbook_id" in
            1KPYzbSawLIrOcckn5EXxO4vH5eABOhMIibhCgpF-oNs|1MWsGQYR13tFjwd-L4lMweGShKJkrOsSNJaHzdjiMNHs)
              echo "::error title=Unsafe BVH workbook::Disposable commissioning resolved to a known operational workbook."
              exit 1
              ;;
          esac

          (
            cd artifacts/api-server
            pnpm exec tsx src/scripts/backfillBvhTestCopy.ts \
              "$BVH_HISTORY_START" "$BVH_HISTORY_END" "$BVH_SLATE_DATE" "$test_workbook_id"
          ) > frostline-bvh-backfill.json
          cat frostline-bvh-backfill.json

          curl --silent --show-error --fail-with-body --request POST \
            "http://127.0.0.1:3000/api/pipeline/publish?date=${BVH_SLATE_DATE}&workbook_id=${test_workbook_id}" \
            --output frostline-bvh-publish.json
          cat frostline-bvh-publish.json
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(r.pipeline_status!=="success"||r.validation_status!=="PASS"||r.errors?.length) process.exit(1);' frostline-bvh-publish.json

          (
            cd artifacts/api-server
            FROSTLINE_WORKBOOK_ID="$test_workbook_id" pnpm exec tsx src/scripts/auditBvhWorkbook.ts --assert
          ) > frostline-bvh-audit.json
          cat frostline-bvh-audit.json

      - name: Upload BVH commissioning evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frostline-bvh-v1-disposable-commissioning
          path: |
            frostline-bvh-workbook.json
            frostline-bvh-backfill.json
            frostline-bvh-publish.json
            frostline-bvh-audit.json
            frostline-api-server.log
          if-no-files-found: error
