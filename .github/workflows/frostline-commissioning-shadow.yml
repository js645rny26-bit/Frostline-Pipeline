name: Frostline commissioning shadow

on:
  workflow_dispatch:
    inputs:
      date:
        description: MLB slate date (YYYY-MM-DD)
        required: true
        default: "2026-08-01"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  commissioning-shadow:
    if: github.ref == 'refs/heads/commissioning/bridge-repair-2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PORT: 3000
      FROSTLINE_SHEETS_BACKEND: google
      FROSTLINE_WORKBOOK_ID: 1KPYzbSawLIrOcckn5EXxO4vH5eABOhMIibhCgpF-oNs
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.FROSTLINE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.FROSTLINE_GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Initialize report files
        run: |
          : > frostline-api-server.log
          echo '{"status":"NOT_RUN"}' > frostline-commissioning-report.json

      - name: Authenticate Google ADC through GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token

      - name: Export short-lived Google access token
        run: |
          echo "FROSTLINE_GOOGLE_ACCESS_TOKEN=${{ steps.google-auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run complete API-server test suite
        working-directory: artifacts/api-server
        run: |
          find src -name '*.test.ts' -print0 |
            xargs -0 node --import tsx/esm --test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run isolated commissioning shadow
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server start \
            > frostline-api-server.log 2>&1 &
          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0

          for attempt in {1..30}; do
            if curl --silent --fail \
              http://127.0.0.1:3000/api/healthz >/dev/null; then
              ready=1
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "API server did not become ready."
            cat frostline-api-server.log
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            "http://127.0.0.1:3000/api/pipeline/publish?date=${{ inputs.date }}&workbook_id=${FROSTLINE_WORKBOOK_ID}" \
            --output frostline-commissioning-report.json

      - name: Upload commissioning evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frostline-commissioning-report-${{ inputs.date }}
          path: |
            frostline-commissioning-report.json
            frostline-api-server.log
          if-no-files-found: error
