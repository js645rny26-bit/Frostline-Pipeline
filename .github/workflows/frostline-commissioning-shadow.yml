name: Frostline commissioning shadow

on:
  workflow_dispatch:
    inputs:
      date:
        description: MLB slate date (YYYY-MM-DD); leave blank for today in America/New_York
        required: false
        default: ""
        type: string
      isolated_smoke:
        description: Use a user-provisioned disposable workbook and run pregame only; never writes the commissioning workbook or runs settlement
        required: false
        default: false
        type: boolean
      isolated_workbook_id:
        description: User-provisioned disposable workbook ID; required only when isolated_smoke is true
        required: false
        default: ""
        type: string
      bootstrap_bvh_history:
        description: One-time source-only BVH history seed for the authoritative workbook; does not publish or rewrite frozen packets
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  commissioning-shadow:
    if: github.ref == 'refs/heads/commissioning/bridge-repair-2026-08-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PORT: 3000
      FROSTLINE_SHEETS_BACKEND: google
      FROSTLINE_WORKBOOK_ID: 1KPYzbSawLIrOcckn5EXxO4vH5eABOhMIibhCgpF-oNs
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.FROSTLINE_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.FROSTLINE_GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve slate date
        id: slate-date
        shell: bash
        run: |
          set -euo pipefail

          requested_date="${{ inputs.date }}"
          if [ -z "$requested_date" ]; then
            slate_date="$(TZ=America/New_York date +%F)"
          else
            if [[ ! "$requested_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error title=Invalid slate date::Expected YYYY-MM-DD, received '$requested_date'."
              exit 1
            fi
            slate_date="$requested_date"
          fi

          today_et="$(TZ=America/New_York date +%F)"
          if [ "${{ inputs.isolated_smoke }}" = "true" ] && { [[ "$slate_date" < "$today_et" ]] || [[ "$slate_date" == "$today_et" ]]; }; then
            echo "::error title=Unsafe isolated smoke date::An isolated smoke run must target a future slate."
            exit 1
          fi

          echo "SLATE_DATE=$slate_date" >> "$GITHUB_ENV"
          echo "date=$slate_date" >> "$GITHUB_OUTPUT"
          echo "Publishing Frostline commissioning slate for $slate_date (America/New_York)."

      - name: Initialize report files
        run: |
          : > frostline-api-server.log
          echo '{"status":"NOT_RUN"}' > frostline-commissioning-report.json
          echo '{"status":"NOT_RUN"}' > frostline-isolated-workbook.json
          echo '{"status":"NOT_RUN"}' > frostline-bvh-backfill.json
          echo '{"status":"NOT_RUN"}' > frostline-bvh-audit.json

      - name: Authenticate Google ADC through GitHub OIDC
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/spreadsheets
            https://www.googleapis.com/auth/drive.file

      - name: Export short-lived Google access token
        run: |
          echo "FROSTLINE_GOOGLE_ACCESS_TOKEN=${{ steps.google-auth.outputs.access_token }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run complete API-server test suite
        working-directory: artifacts/api-server
        run: |
          find src -name '*.test.ts' -print0 |
            xargs -0 node --import tsx/esm --test

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run commissioning pregame or isolated smoke
        shell: bash
        run: |
          set -euo pipefail

          pnpm --filter @workspace/api-server start \
            > frostline-api-server.log 2>&1 &
          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/healthz >/dev/null; then
              ready=1
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "API server did not become ready."
            cat frostline-api-server.log
            exit 1
          fi

          workbook_id="${FROSTLINE_WORKBOOK_ID}"
          if [ "${{ inputs.isolated_smoke }}" = "true" ]; then
            workbook_id="${{ inputs.isolated_workbook_id }}"
            if [ -z "$workbook_id" ]; then
              echo "::error title=Missing isolated workbook::isolated_workbook_id is required when isolated_smoke is true. The GitHub service account can edit a shared workbook but cannot create a Drive file."
              exit 1
            fi
            case "$workbook_id" in
              1KPYzbSawLIrOcckn5EXxO4vH5eABOhMIibhCgpF-oNs|1MWsGQYR13tFjwd-L4lMweGShKJkrOsSNJaHzdjiMNHs)
                echo "::error title=Unsafe isolated workbook::A smoke run must never resolve to a known production workbook."
                exit 1
                ;;
            esac
            node -e 'const fs = require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ workbook_id: process.argv[2], mode: "USER_PROVISIONED_ISOLATED_WORKBOOK" }, null, 2));' frostline-isolated-workbook.json "$workbook_id"
            history_start="2026-09-01"
            history_end="$(TZ=America/New_York date --date='yesterday' +%F)"
            slate_cutoff="$(date --date="${SLATE_DATE} - 1 day" +%F)"
            if [[ "$history_end" > "$slate_cutoff" ]]; then history_end="$slate_cutoff"; fi
            (
              cd artifacts/api-server
              pnpm exec tsx src/scripts/backfillBvhTestCopy.ts \
                "$history_start" "$history_end" "$SLATE_DATE" "$workbook_id"
            ) > frostline-bvh-backfill.json
            cat frostline-bvh-backfill.json
            echo "Isolated pregame smoke workbook: $workbook_id"
          elif [ "${{ inputs.bootstrap_bvh_history }}" = "true" ]; then
            history_start="2026-09-01"
            history_end="$(TZ=America/New_York date --date='yesterday' +%F)"
            slate_cutoff="$(date --date="${SLATE_DATE} - 1 day" +%F)"
            if [[ "$history_end" > "$slate_cutoff" ]]; then history_end="$slate_cutoff"; fi
            (
              cd artifacts/api-server
              pnpm exec tsx src/scripts/backfillBvhTestCopy.ts \
                "$history_start" "$history_end" "$SLATE_DATE" "$workbook_id" \
                "CANONICAL_SOURCE_BOOTSTRAP"
            ) > frostline-bvh-backfill.json
            cat frostline-bvh-backfill.json
          fi

          set +e
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            "http://127.0.0.1:3000/api/pipeline/publish?date=${SLATE_DATE}&workbook_id=${workbook_id}" \
            --output frostline-commissioning-report.json
          publish_status=$?
          set -e

          cat frostline-commissioning-report.json

          if [ "$publish_status" -ne 0 ]; then
            diagnostic="$(node -e 'const fs = require("fs"); const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify({ pipeline_status: result.pipeline_status ?? "unknown", errors: result.errors ?? [result.error ?? "no response error"] }));' frostline-commissioning-report.json)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Isolated commissioning publish failed::$diagnostic"
            echo "Isolated commissioning publish failed; API server log follows."
            cat frostline-api-server.log
            exit "$publish_status"
          fi

          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("frostline-commissioning-report.json", "utf8"));
          const expected = {
            pipeline_status: "success",
            validation_status: "PASS",
            "module_08.status": "success",
            "module_09.status": "verified",
            "module_10.status": "success",
            "module_11.status": "success",
            "module_12.status": "success",
            "module_17.status": "success",
            "module_20_decision_audit.status": "success",
            "module_20a_pregame_packet.status": "success",
            "module_schema_documentation.errors.length": 0,
          };
          const valueAt = (path) => path.split(".").reduce((value, key) => value?.[key], report);
          const failures = Object.entries(expected)
            .filter(([path, expectedValue]) => valueAt(path) !== expectedValue)
            .map(([path, expectedValue]) => `${path}: expected ${expectedValue}, received ${valueAt(path) ?? "missing"}`);
          if (Array.isArray(report.errors) && report.errors.length > 0) {
            failures.push(`top-level errors: ${JSON.stringify(report.errors)}`);
          }
          if (failures.length > 0) {
            console.error(`Commissioning semantic gate failed:\n${failures.join("\n")}`);
            process.exit(1);
          }
          console.log("Commissioning semantic gate passed.");
          NODE

          if [ "${{ inputs.isolated_smoke }}" = "true" ] || [ "${{ inputs.bootstrap_bvh_history }}" = "true" ]; then
            (
              cd artifacts/api-server
              FROSTLINE_WORKBOOK_ID="$workbook_id" pnpm exec tsx src/scripts/auditBvhWorkbook.ts --assert
            ) > frostline-bvh-audit.json
            cat frostline-bvh-audit.json
          fi

      - name: Upload commissioning evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frostline-commissioning-report-${{ steps.slate-date.outputs.date }}
          path: |
            frostline-commissioning-report.json
            frostline-isolated-workbook.json
            frostline-bvh-backfill.json
            frostline-bvh-audit.json
            frostline-api-server.log
          if-no-files-found: error
